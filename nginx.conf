server {
    listen 10000;
    listen [::]:10000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js)$ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
